# Trinket's theme: the XEN look as data (specs/trinket/theming.md).
#
# The theme is three tables: the palette (a colour per ColorRole), the metrics
# (a size per MetricRole, at a 96 dpi base), and the gadgets (a recipe each --
# an ordered list of primitive steps). scripts/gen_theme.py turns them into the
# C++ tables the engine reads; the C++ no longer holds the look.
#
# A recipe step is an inline table naming one primitive, with an optional
# `inset` (pixels in from the gadget's rectangle):
#
#   { fill = "#rrggbb" }              fill the rectangle
#   { bevel = "raised"|"sunken" }     a 1px 3-D edge
#   { outline = "#rrggbb" }           a 1px rectangle
#   { dither = ["#fg", "#bg"] }       a 50% checker
#   { mark = "up"|"down"|"left"|"right", light = "#..", dark = "#..",
#     size = [num, den] }             a hollow 3-D triangle
#
# The values are XEN's, from MUI's Presets/XEN.prefs and its artwork; the base
# is 96 dpi (the Amiga's 75 dpi is how a screenshot of it is read).

# ---- palette ----
# A named colour per role in the toolkit's ColorRole enum.

[palette]
BACKGROUND = "#aaaaaa"
WINDOW_BG = "#aaaaaa"
PANEL_BG = "#aaaaaa"
TEXT = "#000000"
TEXT_DISABLED = "#808080"
TEXT_SELECTED = "#ffffff"
TEXT_INVERSE = "#ffffff"
BUTTON_BG = "#bfbfbf"
BUTTON_HOVER = "#c9c9c9"
BUTTON_PRESSED = "#bfbfbf"
BUTTON_FOCUS = "#000000"
BUTTON_TEXT = "#000000"
BUTTON_BORDER = "#000000"
INPUT_BG = "#bfbfbf"
INPUT_TEXT = "#000000"
INPUT_PLACEHOLDER = "#808080"
INPUT_BORDER = "#8c8c8c"
INPUT_FOCUS_BORDER = "#000000"
SELECTION_BG = "#6688bb"
SELECTION_TEXT = "#ffffff"
CURSOR_BG = "#6688bb"
CURSOR_TEXT = "#ffffff"
ACCENT = "#6688bb"
ACCENT_HOVER = "#7799cc"
ACCENT_PRESSED = "#446699"
BORDER = "#000000"
BORDER_LIGHT = "#ffffff"
BORDER_DARK = "#000000"
FOCUS_BORDER = "#000000"
MENUBAR_BG = "#e0e0e0"
MENUBAR_HOVER = "#0078d7"
MENUBAR_TEXT = "#000000"
MENU_BG = "#f0f0f0"
MENU_HOVER = "#0078d7"
MENU_TEXT = "#000000"
MENU_BORDER = "#808080"
MENU_SEPARATOR = "#808080"
TITLEBAR_BG = "#6688bb"
TITLEBAR_BG_INACTIVE = "#6688bb"
TITLEBAR_TEXT = "#000000"
TITLEBAR_TEXT_INACTIVE = "#000000"
TITLEBAR_BUTTON_BG = "#6688bb"
TITLEBAR_BUTTON_HOVER = "#ffffff"
TITLEBAR_HIGHLIGHT = "#a4b8d7"
TITLEBAR_SHADOW = "#43597b"
BOTTOMBAR_HIGHLIGHT = "#b1c2dc"
BOTTOMBAR_SHADOW = "#2a384d"
GADGET_OUTLINE = "#030303"
GADGET_GREY = "#aaaaaa"
GADGET_WHITE = "#ffffff"
FRAME_LIGHT = "#f7f7f7"
FRAME_DARK = "#2a384d"
GADGET_FACE = "#bfbfbf"
GADGET_HIGHLIGHT = "#ffffff"
GADGET_SHADOW = "#000000"
GADGET_SOFT_SHADOW = "#8c8c8c"
TOOLTIP_BG = "#ffff80"
TOOLTIP_TEXT = "#000000"
SCROLLBAR_BG = "#aaaaaa"
SCROLLBAR_HANDLE = "#bfbfbf"
SCROLLBAR_HANDLE_HOVER = "#c9c9c9"
LINK = "#0000ee"
LINK_VISITED = "#800080"
LINK_HOVER = "#ff0000"
ERROR = "#cc0000"
WARNING = "#cc8800"
SUCCESS = "#008800"
INFO = "#0078d7"
DISABLED_BG = "#e0e0e0"
DISABLED_TEXT = "#808080"

# ---- metrics ----
# A size per role in the MetricRole enum, at a 96 dpi base; the engine scales
# each by the display's scale unless it is named in `fixed`.

[metrics]
fixed = ["TOOLTIP_DELAY_MS", "TEXT_LINE_HEIGHT_MULTIPLIER"]
BUTTON_PADDING_H = 12
BUTTON_PADDING_V = 6
BUTTON_MIN_WIDTH = 72
BUTTON_MIN_HEIGHT = 24
BUTTON_BORDER_WIDTH = 1
BUTTON_RADIUS = 2
PANEL_BORDER_WIDTH = 1
PANEL_RADIUS = 0
MENUBAR_HEIGHT = 22
MENU_ITEM_HEIGHT = 22
MENU_PADDING_H = 8
MENU_PADDING_V = 3
MENU_SEPARATOR_HEIGHT = 1
MENU_BORDER_WIDTH = 1
TITLEBAR_HEIGHT = 24
TITLEBAR_BUTTON_SIZE = 16
TITLEBAR_PADDING_H = 8
WINDOW_BORDER_WIDTH = 1
WINDOW_SHADOW_WIDTH = 0
INPUT_PADDING_H = 8
INPUT_PADDING_V = 4
INPUT_BORDER_WIDTH = 1
SCROLLBAR_WIDTH = 24
SCROLLBAR_MIN_HANDLE = 30
SCROLLBAR_ARROW_SIZE = 21
SLIDER_THICKNESS = 24
SLIDER_KNOB_LENGTH = 16
SLIDER_MIN_LENGTH = 100
CYCLE_BUTTON_WIDTH = 20
CYCLE_MARK_SIZE = 8
POPUP_BUTTON_WIDTH = 22
POPUP_BUTTON_HEIGHT = 17
LIST_ROW_PADDING_V = 2
LIST_PADDING_H = 4
LIST_MIN_WIDTH = 120
LIST_PREFERRED_ROWS = 4
CHECK_INDICATOR_WIDTH = 23
CHECK_INDICATOR_HEIGHT = 18
RADIO_INDICATOR_WIDTH = 17
RADIO_INDICATOR_HEIGHT = 12
TAB_PADDING_H = 10
TAB_HEIGHT = 22
TAB_GAP = 2
TAB_CHAMFER = 3
SPACING_SMALL = 4
SPACING_MEDIUM = 8
SPACING_LARGE = 16
FOCUS_RING_WIDTH = 2
FOCUS_RING_OFFSET = 2
ICON_SIZE_SMALL = 16
ICON_SIZE_NORMAL = 24
ICON_SIZE_LARGE = 32
TOOLTIP_DELAY_MS = 500
TEXT_LINE_HEIGHT_MULTIPLIER = 120

# ---- sprites ----
# The artwork comes from the generated preset (resources/themes/xen-preset.toml,
# scripts/convert_prefs.py), named by MUI's own image roles. A sprite may still
# be added or overridden here; the generator embeds only the ones a recipe names.

# ---- buttons ----
# The face changes with the state; a pressed or focused button is inset.

[gadgets.button.normal]
steps = [{ fill = "$BUTTON_BG" }, { bevel = "raised" }]

[gadgets.button.hovered]
steps = [{ fill = "$BUTTON_HOVER" }, { bevel = "raised" }]

[gadgets.button.pressed]
steps = [{ fill = "$BUTTON_PRESSED" }, { bevel = "sunken" }]

[gadgets.button.focused]
steps = [{ fill = "$BUTTON_BG" }, { bevel = "sunken" }]

[gadgets.button.disabled]
steps = [{ fill = "$DISABLED_BG" }, { bevel = "raised" }]

# ---- toggles (checkbox and radio) ----
# The indicator is the MUI artwork itself (specs/trinket/checkbox.md): the
# checkmark's framed button, or the radio's ring, in its unchecked frame
# (`CheckMark`/`RadioButton`) or its checked one (`...Selected`).

[gadgets.check.off]
steps = [{ sprite = "CheckMark" }]

[gadgets.check.on]
steps = [{ sprite = "CheckMarkSelected" }]

[gadgets.radio.off]
steps = [{ sprite = "RadioButton" }]

[gadgets.radio.on]
steps = [{ sprite = "RadioButtonSelected" }]

# ---- text fields ----
# A sunken well; focus adds a black outline inside it.

[gadgets.textbox.normal]
steps = [{ fill = "$INPUT_BG" }, { bevel = "sunken" }]

[gadgets.textbox.focused]
steps = [{ fill = "$INPUT_BG" }, { bevel = "sunken" },
         { outline = "$INPUT_FOCUS_BORDER", inset = 1 }]

[gadgets.textbox.readonly]
steps = [{ fill = "$DISABLED_BG" }, { bevel = "sunken" }]

# ---- panels ----
# The face is the group grey; the frame style is the bevel.

[gadgets.panel.flat]
steps = [{ fill = "$PANEL_BG" }]

[gadgets.panel.raised]
steps = [{ fill = "$PANEL_BG" }, { bevel = "raised" }]

[gadgets.panel.sunken]
steps = [{ fill = "$PANEL_BG" }, { bevel = "sunken" }]

[gadgets.panel.frame]
steps = [{ fill = "$PANEL_BG" }, { outline = "$BORDER" }]

[gadgets.panel.group_box]
steps = [{ fill = "$PANEL_BG" }, { bevel = "raised" }]

# ---- the scrollbar ----
# The trough is one beveled container -- a raised frame around a sunken dither
# well the thumb rides in -- and the two arrow buttons are separate cells below
# it, not inside the same frame (specs/trinket/scrollbar.md). The buttons are the
# MUI artwork, so the mark is the art's own.

[gadgets.scrollbar.trough]
steps = [{ fill = "$PANEL_BG" }, { outline = "$GADGET_SHADOW" },
         { bevel = "raised", inset = 1 },
         { dither = ["$SELECTION_BG", "$SCROLLBAR_BG"], inset = 4 },
         { bevel = "sunken", inset = 4 }]

[gadgets.scrollbar.thumb]
steps = [{ fill = "$SCROLLBAR_HANDLE" }, { bevel = "raised" }]

# The arrow buttons: one recipe per orientation and press state, because the
# sprite is the whole cell and the art names the direction. Vertical is
# ArrowUp/ArrowDown, horizontal ArrowLeft/ArrowRight; the `_pressed` frame is the
# MUI selected image, drawn while the button is held (specs/trinket/scrollbar.md).

[gadgets.scrollbar.decrement]
steps = [{ sprite = "ArrowUp" }]

[gadgets.scrollbar.decrement_pressed]
steps = [{ sprite = "ArrowUpSelected" }]

[gadgets.scrollbar.increment]
steps = [{ sprite = "ArrowDown" }]

[gadgets.scrollbar.increment_pressed]
steps = [{ sprite = "ArrowDownSelected" }]

[gadgets.scrollbar.decrement_horizontal]
steps = [{ sprite = "ArrowLeft" }]

[gadgets.scrollbar.decrement_horizontal_pressed]
steps = [{ sprite = "ArrowLeftSelected" }]

[gadgets.scrollbar.increment_horizontal]
steps = [{ sprite = "ArrowRight" }]

[gadgets.scrollbar.increment_horizontal_pressed]
steps = [{ sprite = "ArrowRightSelected" }]

# ---- the slider ----
# The same XEN face as the bar (specs/trinket/slider.md): the preset assigns
# PropBack the dither pattern and PropKnob the same xenbar programme the
# scrollbar's thumb comes from, so the two share their recipes here too. They
# are the slider's own entries, so either can diverge without touching a widget.

[gadgets.slider.trough]
steps = [{ fill = "$PANEL_BG" }, { outline = "$GADGET_SHADOW" },
         { bevel = "raised", inset = 1 },
         { dither = ["$SELECTION_BG", "$SCROLLBAR_BG"], inset = 4 },
         { bevel = "sunken", inset = 4 }]

[gadgets.slider.knob]
steps = [{ fill = "$SCROLLBAR_HANDLE" }, { bevel = "raised" }]

# ---- the cycle ----
# A boxed gadget (specs/trinket/cycle.md, from the MUI demo's screenshot): a
# black outline around a raised bevel, a button cell at the left with a hollow
# raised-square mark, and a one-pixel divider between the cell and the entry
# text. `Cycle.mbr` is a 16x11 bitmap the engine's whole-image blit would
# distort, so the same edges are drawn from the primitives.

[gadgets.cycle.face]
steps = [{ fill = "$BUTTON_BG" }, { outline = "$GADGET_SHADOW" },
         { bevel = "raised", inset = 1 }]

[gadgets.cycle.pressed]
steps = [{ fill = "$BUTTON_PRESSED" }, { outline = "$GADGET_SHADOW" },
         { bevel = "sunken", inset = 1 }]

[gadgets.cycle.divider]
steps = [{ fill = "$GADGET_SHADOW" }]

[gadgets.cycle.mark]
steps = [{ bevel = "raised" }]

# ---- the popup button ----
# The MUI image is the whole button (specs/trinket/popup_button.md): a magnifier
# (`PopUp`), a document (`PopFile`) or a drawer (`PopDrawer`), each with the
# selected frame the preset's `.mf1` holds.

[gadgets.popup.popup_normal]
steps = [{ sprite = "PopUp" }]

[gadgets.popup.popup_selected]
steps = [{ sprite = "PopUpSelected" }]

[gadgets.popup.file_normal]
steps = [{ sprite = "PopFile" }]

[gadgets.popup.file_selected]
steps = [{ sprite = "PopFileSelected" }]

[gadgets.popup.drawer_normal]
steps = [{ sprite = "PopDrawer" }]

[gadgets.popup.drawer_selected]
steps = [{ sprite = "PopDrawerSelected" }]

# ---- the list ----
# A black outline around the gadget face, and one row in one of three states
# (specs/trinket/listview.md). The preset gives the cursor a *pattern* and the
# selection a *colour*: the row being pointed at is the blue/grey dither, and
# the chosen row is a solid bar with its text still black.

[gadgets.list.well]
steps = [{ fill = "$GADGET_FACE" }, { outline = "$GADGET_SHADOW" }]

[gadgets.list.cursor]
steps = [{ dither = ["$SELECTION_BG", "$GADGET_FACE"] }]

[gadgets.list.selected]
steps = [{ fill = "$SELECTION_BG" }]

# ---- icons ----
# A row's image (specs/trinket/listview.md, specs/trinket/file_requester.md): the
# imported MUI drawer and volume artwork, one recipe per role, the sprite scaled
# into the cell as the arrows are. Icon::NONE is the empty recipe, and a theme
# with no art for a role draws nothing for it too.

[gadgets.icon.none]
steps = []

[gadgets.icon.drawer]
steps = [{ sprite = "Drawer" }]

[gadgets.icon.hard_disk]
steps = [{ sprite = "HardDisk" }]

[gadgets.icon.disk]
steps = [{ sprite = "Disk" }]

[gadgets.icon.chip]
steps = [{ sprite = "Chip" }]

[gadgets.icon.volume]
steps = [{ sprite = "Volume" }]

[gadgets.icon.network]
steps = [{ sprite = "Network" }]

# ---- the window chrome ----
# The window manager's furniture (specs/trinket/chrome.md): the title bar, the
# bottom bar, the frame, and the close/zoom/depth gadgets. A bar's light line is
# one pixel down from its top (the frame's own light line is above it) and its
# dark line the last row, so those are `line` steps, one edge each. A gadget's
# glyph is a sub-rectangle of the cell in sixteenths (`at`), which is how the
# close box, the zoom box-in-a-box and the cascaded depth squares are recipes.

[gadgets.titlebar.inactive]
steps = [{ fill = "$TITLEBAR_BG_INACTIVE" },
         { line = "top", color = "$TITLEBAR_HIGHLIGHT", inset = 1 },
         { line = "bottom", color = "$TITLEBAR_SHADOW" }]

[gadgets.titlebar.active]
steps = [{ fill = "$TITLEBAR_BG" },
         { line = "top", color = "$TITLEBAR_HIGHLIGHT", inset = 1 },
         { line = "bottom", color = "$TITLEBAR_SHADOW" }]

[gadgets.bottombar]
steps = [{ fill = "$TITLEBAR_BG" },
         { line = "top", color = "$BOTTOMBAR_HIGHLIGHT", inset = 1 },
         { line = "bottom", color = "$BOTTOMBAR_SHADOW", inset = 1 }]

[gadgets.frame]
steps = [{ line = "top", color = "$FRAME_LIGHT" },
         { line = "left", color = "$FRAME_LIGHT" },
         { line = "bottom", color = "$FRAME_DARK" },
         { line = "right", color = "$FRAME_DARK" }]

# Close: an 8x8 box centred in the 16x16 cell, white when the window is active
# and the bar's fill when not, so the glyph reads hollow.
[gadgets.gadget.close_active]
steps = [{ fill = "$GADGET_WHITE", at = [4, 4, 12, 12] },
         { outline = "$GADGET_OUTLINE", at = [4, 4, 12, 12] }]

[gadgets.gadget.close_inactive]
steps = [{ fill = "$TITLEBAR_BG", at = [4, 4, 12, 12] },
         { outline = "$GADGET_OUTLINE", at = [4, 4, 12, 12] }]

# Zoom: a box in a box; the outer is the bar's fill, the inner the upper-left.
[gadgets.gadget.zoom_active]
steps = [{ fill = "$TITLEBAR_BG", at = [2, 2, 14, 14] },
         { outline = "$GADGET_OUTLINE", at = [2, 2, 14, 14] },
         { fill = "$GADGET_WHITE", at = [4, 4, 10, 10] },
         { outline = "$GADGET_OUTLINE", at = [4, 4, 10, 10] }]

[gadgets.gadget.zoom_inactive]
steps = [{ fill = "$TITLEBAR_BG", at = [2, 2, 14, 14] },
         { outline = "$GADGET_OUTLINE", at = [2, 2, 14, 14] },
         { fill = "$TITLEBAR_BG", at = [4, 4, 10, 10] },
         { outline = "$GADGET_OUTLINE", at = [4, 4, 10, 10] }]

# Depth: two cascaded squares, the upper grey and the lower white.
[gadgets.gadget.depth_active]
steps = [{ fill = "$GADGET_GREY", at = [2, 2, 12, 12] },
         { outline = "$GADGET_OUTLINE", at = [2, 2, 12, 12] },
         { fill = "$GADGET_WHITE", at = [5, 5, 15, 15] },
         { outline = "$GADGET_OUTLINE", at = [5, 5, 15, 15] }]

[gadgets.gadget.depth_inactive]
steps = [{ fill = "$TITLEBAR_BG", at = [2, 2, 12, 12] },
         { outline = "$GADGET_OUTLINE", at = [2, 2, 12, 12] },
         { fill = "$TITLEBAR_BG", at = [5, 5, 15, 15] },
         { outline = "$GADGET_OUTLINE", at = [5, 5, 15, 15] }]

# ---- the screen bar and the menus ----
# The screen bar is the title bar's look across the top of the screen
# (specs/workbench.md); the in-window menu bar, its popups and their
# accelerator keycaps are their own (specs/trinket/chrome.md).

[gadgets.screen_bar]
steps = [{ fill = "$TITLEBAR_BG" },
         { line = "top", color = "$TITLEBAR_HIGHLIGHT", inset = 1 },
         { line = "bottom", color = "$TITLEBAR_SHADOW" }]

[gadgets.menubar]
steps = [{ fill = "$MENUBAR_BG" },
         { line = "bottom", color = "$MENU_BORDER" }]

[gadgets.menu_well]
steps = [{ fill = "$MENU_BG" }, { outline = "$MENU_BORDER" }]

[gadgets.menu_item.normal]
steps = []

[gadgets.menu_item.hovered]
steps = [{ fill = "$MENU_HOVER" }]

# A keycap is a raised box around a modifier's name (specs/trinket/chrome.md);
# the light and dark lines are the white/grey pair the window gadgets use.
[gadgets.keycap]
steps = [{ fill = "$BUTTON_BG" }, { outline = "$BUTTON_BORDER" },
         { line = "top", color = "$GADGET_WHITE", inset = 1 },
         { line = "left", color = "$GADGET_WHITE", inset = 1 },
         { line = "bottom", color = "$GADGET_GREY", inset = 1 },
         { line = "right", color = "$GADGET_GREY", inset = 1 }]
