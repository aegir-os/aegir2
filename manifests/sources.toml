signature_url = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0.tar.gz.sig"
signature_sha256 = "434aa81b514a0c7b94eb1b3e7784afe4d521b1a96a71de4a2d3476be3c595555"
signature_archive = "libjpeg-turbo-3.2.0.tar.gz.sig"
signing_key = "manifests/libjpeg-turbo-signing-key.asc"
# The key's full fingerprint, as gpg --status-fd reports it (no spaces).
signing_fingerprint = "0338C8D8D9FDA62CF9C421BD7EC2DBB6F4DBF434"
# The single top-level directory the tarball extracts, moved to `path`.
extract_dir = "libjpeg-turbo-3.2.0"

# The Unicode Character Database (UCD), fetched as individually pinned files
# rather than a tarball. The table files generate the toolkit's UAX #9 tables
# and its character widths at build time (scripts/gen_bidi_tables.py,
# scripts/gen_width_tables.py); the two conformance files are what the
# algorithm is tested against (scripts/check_bidi.py). Unicode
# publishes no release signature for these files, so the sha256 is the pin.
# The files are redistributed under the Unicode Terms of Use (Unicode-DFS-2016
# for the data, the UCD's own terms for the conformance files).
[[source]]
name = "ucd"
