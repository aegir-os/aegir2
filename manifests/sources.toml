# Pinned target sources fetched as release tarballs.
#
# Most vendored trees come from git through repo (manifests/aegir.xml). musl
# does not: its official git server is not a reliable fetch target (git:// is
# blocked on some hosts, and the https URL redirects to a cgit web view rather
# than a git remote), and the official release tarball is the canonical
# artifact with better provenance. It is pinned here by sha256 and verified
# against musl's own detached signature before it is extracted.
#
# The public key is committed at manifests/musl-signing-key.asc. Verification
# builds a throwaway keyring from it, so the host's keyring is untouched.

[[source]]
name = "musl"
version = "1.2.6"
path = "projects/musl"
url = "https://musl.libc.org/releases/musl-1.2.6.tar.gz"
sha256 = "d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a"
archive = "musl-1.2.6.tar.gz"
signature_url = "https://musl.libc.org/releases/musl-1.2.6.tar.gz.asc"
signature_sha256 = "8a696228404cd4bae6379cf7538fc5d18c133b0ada54a41c1c6cef31d3c22ab6"
signature_archive = "musl-1.2.6.tar.gz.asc"
signing_key = "manifests/musl-signing-key.asc"
# The key's full fingerprint, as gpg --status-fd reports it (no spaces).
signing_fingerprint = "836489290BB6B70F99FFDA0556BCDB593020450F"
# The single top-level directory the tarball extracts, moved to `path`.
extract_dir = "musl-1.2.6"

# The Unicode Character Database (UCD), fetched as individually pinned files
# rather than a tarball. The three table files generate the toolkit's UAX #9
# tables at build time (scripts/gen_bidi_tables.py); the two conformance files
# are what the algorithm is tested against (scripts/check_bidi.py). Unicode
# publishes no release signature for these files, so the sha256 is the pin.
# The files are redistributed under the Unicode Terms of Use (Unicode-DFS-2016
# for the data, the UCD's own terms for the conformance files).
[[source]]
name = "ucd"
version = "16.0.0"
path = "projects/ucd/unicode-16.0.0"
base_url = "https://www.unicode.org/Public/16.0.0/ucd/"
license = "Unicode-DFS-2016"
files = [
  { name = "extracted/DerivedBidiClass.txt", sha256 = "71ed943a49c58568d8d92e80ecc2ba2f06e62aee9c8ebb0e6e8bd2c3ed8b180e" },
  { name = "BidiMirroring.txt", sha256 = "d7afdadd1bbd66f5a663ac0e8f7958f18fd9491fc0bc59ec5877cb82db71db7d" },
  { name = "BidiBrackets.txt", sha256 = "b8f32554c6f658821fb0ee742d21c5b1f2086b9bf13071fed04894b022f93d67" },
  { name = "BidiTest.txt", sha256 = "93e5eb9d88ca89dcf895f5576486a3363762ad2aa8f2db2fa56fe60cb82b9520" },
  { name = "BidiCharacterTest.txt", sha256 = "d04a51a90052dcd71c4e91ee5b3a9d973ee35c12406b5a99875ac8163c8f2804" },
]

# The Common Locale Data Repository (CLDR), fetched as individually pinned
# files under the cldr-json tree, the same shape as the UCD above. CLDR 46.0.0
# is the release built on UCD 16.0.0. Nine languages carry number, currency,
# date, list and layout data (scripts/gen_locale_data.py compiles them into the
# toolkit's .locale blobs); plurals.json and numberingSystems.json are shared.
# CLDR publishes no release signature for these files, so the sha256 is the
# pin. CLDR data is redistributed under the Unicode License v3.
#
# CLDR's root locale is not published in cldr-json (only language directories
# under main/), so the nine are pinned whole; the generator applies documented
# defaults for any field a language file leaves out, which is what root would
# have supplied.
[[source]]
