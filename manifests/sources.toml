# The Common Locale Data Repository (CLDR), fetched as individually pinned
# files under the cldr-json tree, the same shape as the UCD above. CLDR 46.0.0
# is the release built on UCD 16.0.0. Nine languages carry number, currency,
# date, list, layout and digital-unit data (scripts/gen_locale_data.py compiles
# them into the toolkit's .locale blobs); plurals.json and numberingSystems.json
# are shared. CLDR's digital units are decimal (byte/kB/MB/GB/TB); it publishes
# no binary kibibyte/mebibyte, so a size shows the decimal ones.
# CLDR publishes no release signature for these files, so the sha256 is the
# pin. CLDR data is redistributed under the Unicode License v3.
#
# CLDR's root locale is not published in cldr-json (only language directories
# under main/), so the nine are pinned whole; the generator applies documented
# defaults for any field a language file leaves out, which is what root would
# have supplied.
[[source]]
