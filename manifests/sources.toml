# The POSIX specification pages the conformance suite derives its assertions
# from (specs/posix.md). A *reference*, not code we build: fetched so a test can
# cite its clause offline, never modified, never committed (third_party/ is
# gitignored). The Open Group publishes the Base Specifications Issue 8 -- IEEE
# Std 1003.1-2024 -- as HTML under pubs.opengroup.org; each page's sha256 is the
# pin, the same file-source shape as the UCD above. The text is Copyright IEEE
# and The Open Group and is **not redistributed**: we read it and write our own
# assertions, which is why this is a reference and not a vendored test corpus.
# `madvise` is not a POSIX name; the call is `posix_madvise`.
[[source]]
name = "posix-spec"
version = "issue8"
path = "third_party/posix-spec/issue8"
base_url = "https://pubs.opengroup.org/onlinepubs/9799919799/functions/"
license = "Copyright 2001-2024 IEEE and The Open Group; reference only, not redistributed"
