# Pinned target sources fetched as release tarballs.
#
# Most vendored trees come from git through repo (manifests/aegir.xml). musl
# does not: its official git server is not a reliable fetch target (git:// is
# blocked on some hosts, and the https URL redirects to a cgit web view rather
# than a git remote), and the official release tarball is the canonical
# artifact with better provenance. It is pinned here by sha256 and verified
# against musl's own detached signature before it is extracted.
#
# The public key is committed at manifests/musl-signing-key.asc. Verification
# builds a throwaway keyring from it, so the host's keyring is untouched.

[[source]]
name = "musl"
version = "1.2.6"
path = "projects/musl"
url = "https://musl.libc.org/releases/musl-1.2.6.tar.gz"
sha256 = "d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a"
archive = "musl-1.2.6.tar.gz"
signature_url = "https://musl.libc.org/releases/musl-1.2.6.tar.gz.asc"
signature_sha256 = "8a696228404cd4bae6379cf7538fc5d18c133b0ada54a41c1c6cef31d3c22ab6"
signature_archive = "musl-1.2.6.tar.gz.asc"
signing_key = "manifests/musl-signing-key.asc"
# The key's full fingerprint, as gpg --status-fd reports it (no spaces).
signing_fingerprint = "836489290BB6B70F99FFDA0556BCDB593020450F"
# The single top-level directory the tarball extracts, moved to `path`.
extract_dir = "musl-1.2.6"

# FreeType, the rasterizer the font service owns (specs/fonts.md). It is not a
# git project we take a revision of: the release tarball is the canonical
# artifact, its maintainer signs every release with a detached signature, and
# the pin is therefore a content hash plus the signature plus that key's
# fingerprint -- stronger than a mirror's commit, exactly as musl's is. The
# key (Werner Lemberg, the maintainer who cuts FreeType's releases) is
# committed at manifests/freetype-signing-key.asc. FreeType is dual-licensed
# FTL/GPL-2.0-only; Aegir takes it under the FTL (THIRD-PARTY.md).
[[source]]
name = "freetype"
version = "2.14.3"
path = "projects/freetype"
url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz"
sha256 = "36bc4f1cc413335368ee656c42afca65c5a3987e8768cc28cf11ba775e785a5f"
archive = "freetype-2.14.3.tar.xz"
signature_url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz.sig"
signature_sha256 = "9bc9f852c4ec9d037a6e92c022e0b020a00dfd9644c644c12c6d4352792f46a3"
signature_archive = "freetype-2.14.3.tar.xz.sig"
signing_key = "manifests/freetype-signing-key.asc"
# The key's full fingerprint, as gpg --status-fd reports it (no spaces).
signing_fingerprint = "E30674707856409FF1948010BE6C3AAC63AD8E3F"
# The single top-level directory the tarball extracts, moved to `path`.
extract_dir = "freetype-2.14.3"

# zlib, the DEFLATE library libpng reads through (specs/datatypes.md's PNG
# class). Its releases are signed by Mark Adler, the maintainer, and the
# official tarball plus detached signature are on zlib.net; the key is
# committed at manifests/zlib-signing-key.asc. zlib is licensed under the Zlib
# license (THIRD-PARTY.md). It is built static beside musl
# (scripts/build_zlib.sh) and linked into libpng, because Aegir has no dynamic
# loader.
[[source]]
name = "zlib"
version = "1.3.2"
path = "projects/zlib"
url = "https://zlib.net/zlib-1.3.2.tar.xz"
sha256 = "d7a0654783a4da529d1bb793b7ad9c3318020af77667bcae35f95d0e42a792f3"
archive = "zlib-1.3.2.tar.xz"
signature_url = "https://zlib.net/zlib-1.3.2.tar.xz.asc"
signature_sha256 = "03ce710347e2f84fa7ed0a6ae6a93467b08031a3022fc296da40220a83b96667"
signature_archive = "zlib-1.3.2.tar.xz.asc"
signing_key = "manifests/zlib-signing-key.asc"
# The key's full fingerprint, as gpg --status-fd reports it (no spaces).
signing_fingerprint = "5ED46A6721D365587791E2AA783FCD8E58BCAFBA"
# The single top-level directory the tarball extracts, moved to `path`.
extract_dir = "zlib-1.3.2"

# libpng, the PNG decoder the png.datatype class serves (specs/datatypes.md).
# Unlike musl and FreeType, libpng publishes no detached release signature:
# SourceForge lists only the tarballs, and libpng.org links the same two. The
# sha256 is therefore the whole pin for it -- an exception to the signed-tarball
# rule, recorded in specs/third_party.md. The tarball is the canonical artifact
# and download.sourceforge.net is the project's own release directory (it
# redirects to a mirror). libpng is licensed under libpng-2.0, its own
# permissive BSD-like license; Aegir takes it under that (THIRD-PARTY.md).
[[source]]
name = "libpng"
version = "1.6.59"
path = "projects/libpng"
url = "https://download.sourceforge.net/libpng/libpng-1.6.59.tar.xz"
sha256 = "d80dd2a38a37f803cb9b6ac7b14bd6e74ddc3b654780a8380bdf93523fdb4389"
archive = "libpng-1.6.59.tar.xz"
# The single top-level directory the tarball extracts, moved to `path`.
extract_dir = "libpng-1.6.59"

# libjpeg-turbo, the JPEG decoder the jpeg.datatype class serves
# (specs/datatypes.md). It is the reference IJG libjpeg with SIMD, and the
# project signs every source tarball with a detached signature; the tarball,
# that signature and the project's own key are on the release page, and the key
# is committed at manifests/libjpeg-turbo-signing-key.asc. Upstream covers the
# libjpeg API under the IJG License and the rest under 3-clause BSD; Aegir
# builds only the libjpeg API library (no TurboJPEG), so the IJG License is the
# one it takes (THIRD-PARTY.md). Built static beside musl
# (scripts/build_libjpeg.sh).
[[source]]
name = "libjpeg-turbo"
version = "3.2.0"
path = "projects/libjpeg-turbo"
