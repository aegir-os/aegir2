[[interface]]
name = "chmod"
area = "files"
# `partial`: the dispatcher answers fchmodat, but the scratch volume is FAT and
# has no mode bits, so protect answers EOPNOTSUPP. The suite asserts the refusal
# rather than a pass (specs/posix-conformance.md).
state = "partial"
syscall = 53
clause = "chmod.html"

[[interface]]
name = "fchmod"
area = "files"
state = "partial"
syscall = 52
clause = "fchmod.html"

[[interface]]
name = "fcntl"
area = "files"
# `partial`: F_GETFL/F_GETFD/F_SETFD are answered, but no descriptor flags are
# kept (there is no exec), so FD_CLOEXEC is not tracked and F_GETFL does not
# report the access mode. The suite names that rather than passing it.
state = "partial"
syscall = 25
clause = "fcntl.html"

