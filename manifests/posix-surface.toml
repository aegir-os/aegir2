# manifests/posix-surface.toml
#
# The POSIX surface Aegir claims, and how much of it the conformance suite
# proves. Read by scripts/check_posix_coverage.py (see specs/posix-conformance.md).
#
# An *area* is `todo` until every interface in it is enumerated, and `covered`
# once each of those has a case in the suite. `make check-posix-coverage` fails
# while any area is `todo` or any interface has no case, naming what is left --
# so this file is the worklist, and a hole is never a silence.
#
# `state = "implemented"` means Aegir answers the call; `state = "unimplemented"`
# means it must return the standard's ENOSYS, and the suite asserts it.
# `syscall` is the riscv64 number the interface reaches (0 for a libc-only
# call). The dispatcher (`heap.cc`'s `vsyscall`) is the truth for "answered":
# the check cross-reads the two and either disagreeing is a failure.
#
# `clause` is the Issue 8 page (or, for an Aegir extension, the page's own name)
# the cases are derived from; third_party/posix-spec/issue8 holds the fetched
# text and is not vendored.

[surface]
version = 1

# ---------------------------------------------------------------------------
# areas -- the check fails while any of these is `todo`
# ---------------------------------------------------------------------------

[[area]]
name = "memory"
status = "covered"

[[area]]
name = "files"
status = "covered"

[[area]]
name = "directories"
status = "covered"

[[area]]
name = "process"
status = "covered"

[[area]]
name = "environment"
status = "covered"

[[area]]
name = "time"
status = "covered"

[[area]]
name = "sockets"
status = "covered"

[[area]]
name = "signals"
status = "covered"

[[area]]
name = "threads"
status = "covered"

