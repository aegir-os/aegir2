# Pinned host build inputs.
#
# This file is the single source of truth for the revisions of the tools we
# fetch to build Aegir; see specs/build.md. Nothing here is committed to the
# repository as source — everything is downloaded and verified on demand.
#
# The RISC-V toolchain is a user-level tarball install: no root, no package
# manager, no mutation of the host.

[toolchain]
name = "riscv-none-elf-gcc"
vendor = "xPack"
version = "15.2.0-1"
# The cross compiler is addressed through this prefix. seL4's gcc.cmake probes
# a list of known prefixes that does not include riscv-none-elf-, so
# CROSS_COMPILER_PREFIX must always be set explicitly in configs/.
prefix = "riscv-none-elf-"
platform = "linux-x64"
url = "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz"
sha256 = "aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758"
archive = "xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz"
# The arch/abi our target uses. The toolchain must resolve these to an
# installed multilib. Checked by asking the compiler (`-print-multi-directory`,
# `-print-libgcc-file-name`) rather than by looking for a directory name,
# because vendors name multilibs differently: for these flags xPack's GCC 15
# reports `rv64imafdc_zicsr_zaamo_zalrsc/lp64d` (the A extension is split into
# zaamo/zalrsc), not `rv64imafdc/lp64d`.
require_march = "rv64imafdc_zicsr_zifencei"
require_mabi = "lp64d"
